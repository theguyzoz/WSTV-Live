<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WSTV Live — WebSockets Television</title>
<link rel="icon" type="image/svg+xml" href="/assets/icon.svg">
<link rel="stylesheet" href="/assets/wstv.css">
<style>
/* boot splash, like a decoder warming up */
#splash{position:fixed;inset:0;z-index:200;background:var(--bg);display:grid;place-items:center;transition:opacity .45s}
#splash .slogo{display:flex;flex-direction:column;align-items:center;gap:14px;font-size:2.2rem;font-weight:900;letter-spacing:-.02em;color:#fff;animation:splashin .8s ease}
#splash .slogo em{font-style:normal;color:var(--pink);font-size:.8rem;letter-spacing:.3em;border:2px solid var(--pink);border-radius:8px;padding:2px 10px;vertical-align:middle;margin-left:10px}
@keyframes splashin{0%{opacity:0;transform:scale(.92)}100%{opacity:1;transform:scale(1)}}
#splash.gone{opacity:0;pointer-events:none}

.layout{display:grid;grid-template-columns:288px 1fr;gap:18px;padding:18px;max-width:1440px;margin:0 auto;align-items:start}

/* channel rail */
.rail{position:sticky;top:76px;max-height:calc(100vh - 96px);overflow-y:auto}
.rail-head{font-size:.66rem;font-weight:800;color:var(--mut2);text-transform:uppercase;letter-spacing:.1em;padding:2px 6px 8px}
.chrow{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:11px;cursor:pointer;border:1px solid transparent;transition:.12s}
.chrow:hover{background:var(--panel)}
.chrow.active{background:var(--panel);border-color:var(--brand)}
.chnum{font-size:.68rem;font-weight:800;color:var(--mut2);width:26px;text-align:right;font-variant-numeric:tabular-nums}
.chmeta{flex:1;min-width:0}
.chname{font-size:.86rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chnext{font-size:.7rem;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vw{font-size:.66rem;color:var(--mut2);white-space:nowrap}

/* i-plate hero */
.iplate{overflow:hidden}
.ip-screen{position:relative;aspect-ratio:16/9;background:radial-gradient(120% 160% at 20% 0%,#1b2540 0%,#0c1120 60%,#080c16 100%);display:flex;align-items:flex-end;padding:20px}
.ip-screen img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.5;filter:saturate(.9)}
.ip-screen .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,12,22,.1) 20%,rgba(8,12,22,.92) 100%)}
.ip-content{position:relative;z-index:2;width:100%}
.ip-badges{display:flex;gap:8px;margin-bottom:10px;align-items:center;flex-wrap:wrap}
.ip-title{font-size:clamp(1.3rem,3.4vw,2.1rem);font-weight:900;letter-spacing:-.02em;line-height:1.15;max-width:640px}
.ip-sub{color:#c3cde0;font-size:.88rem;margin-top:6px;max-width:560px}
.ip-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.ip-strip{display:flex;border-top:1px solid var(--line)}
.ip-cell{flex:1;padding:12px 16px;border-right:1px solid var(--line);min-width:0}
.ip-cell:last-child{border-right:none}
.ip-cell .k{font-size:.62rem;font-weight:800;color:var(--mut2);text-transform:uppercase;letter-spacing:.1em;margin-bottom:3px}
.ip-cell .v{font-size:.86rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* epg grid */
.epg-wrap{overflow-x:auto}
.epg{min-width:760px}
.epg-hours{display:flex;border-bottom:1px solid var(--line);position:relative}
.epg-hours .hlab{flex:1;padding:8px 10px;font-size:.68rem;font-weight:800;color:var(--mut);letter-spacing:.06em}
.epg-row{display:flex;border-bottom:1px solid var(--line);position:relative;min-height:46px}
.epg-row:hover{background:rgba(124,92,255,.04)}
.epg-ch{width:170px;flex:none;display:flex;align-items:center;gap:8px;padding:6px 8px;cursor:pointer;border-right:1px solid var(--line)}
.epg-ch .n{font-size:.8rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.epg-lane{flex:1;position:relative}
.epg-block{position:absolute;top:6px;bottom:6px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);padding:5px 9px;font-size:.72rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;transition:.12s}
.epg-block:hover{border-color:var(--brand)}
.epg-block.on{background:linear-gradient(135deg,rgba(124,92,255,.35),rgba(255,77,141,.25));border-color:var(--brand)}
.nowline{position:absolute;top:0;bottom:0;width:2px;background:var(--pink);z-index:5;box-shadow:0 0 8px rgba(255,77,141,.7)}
.nowline::before{content:'';position:absolute;top:-1px;left:-4px;width:10px;height:10px;border-radius:50%;background:var(--pink)}

/* mobile */
.chips{display:none;gap:8px;overflow-x:auto;padding:12px 16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:6px 13px;font-size:.8rem;font-weight:700;cursor:pointer}
.chip.active{border-color:var(--brand);background:var(--panel2)}
.moblist{display:none;padding:0 16px}
.mobrow{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.tabbar{display:none;position:fixed;bottom:0;left:0;right:0;z-index:60;background:rgba(10,14,23,.92);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 11px;color:var(--mut);font-size:.64rem;font-weight:800;letter-spacing:.04em}
.tabbar a.on{color:var(--brand2)}
@media(max-width:860px){
  .layout{grid-template-columns:1fr;padding:12px}
  .rail{display:none}
  .chips{display:flex}
  .epg-card{display:none}
  .moblist{display:block}
  .tabbar{display:flex}
  body{padding-bottom:64px}
}
</style>
</head>
<body>
<div id="splash"><div class="slogo"><svg viewBox="0 0 64 64" width="84" height="84" aria-hidden="true"><defs><linearGradient id="sp" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#ff4d8d"/></linearGradient></defs><path d="M23 12l9 12 9-12" fill="none" stroke="url(#sp)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="8" y="24" width="48" height="30" rx="9" fill="url(#sp)"/><path d="M28 33l13 6.5L28 46z" fill="#fff"/></svg><div>WSTV<em>LIVE</em></div></div></div>

<header class="topbar">
  <a class="logo" href="/"><span class="tv"><svg viewBox="0 0 64 64" width="27" height="27" aria-hidden="true"><defs><linearGradient id="lg0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#ff4d8d"/></linearGradient></defs><path d="M23 12l9 12 9-12" fill="none" stroke="url(#lg0)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="8" y="24" width="48" height="30" rx="9" fill="url(#lg0)"/><path d="M28 33l13 6.5L28 46z" fill="#fff"/></svg></span>WSTV<em>LIVE</em></a>
  <nav class="row" style="gap:16px;font-size:.85rem;font-weight:700">
    <a href="/" style="color:var(--txt)">Guide</a>
    <a href="/studio" style="color:var(--mut)">Studio</a>
  </nav>
  <div class="spacer"></div>
  <span class="mono mut" id="clock" style="font-size:.9rem;font-weight:700"></span>
  <a class="btn btn-brand btn-sm" id="acct" href="/login">Sign in</a>
</header>

<!-- mobile channel chips -->
<div class="chips" id="chips"></div>

<div class="layout">
  <aside class="rail">
    <div class="rail-head">Channels</div>
    <div id="rail"></div>
  </aside>

  <main>
    <!-- selected channel i-plate -->
    <section class="card iplate" id="iplate" style="margin-bottom:18px">
      <div class="ip-screen" id="ip-screen"></div>
      <div class="ip-strip" id="ip-strip"></div>
    </section>

    <div id="mobwrap"></div>

    <!-- epg grid -->
    <section class="card epg-card">
      <div style="display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)">
        <b style="font-size:.95rem">Programme guide</b>
        <span class="mut" style="font-size:.76rem">next 4 hours</span>
        <div class="spacer" style="flex:1"></div>
        <span class="row" style="gap:6px;font-size:.68rem;color:var(--mut)"><span style="width:10px;height:10px;border-radius:3px;background:linear-gradient(135deg,rgba(124,92,255,.5),rgba(255,77,141,.4));display:inline-block"></span>on now</span>
      </div>
      <div class="epg-wrap"><div class="epg" id="epg"></div></div>
    </section>
  </main>
</div>

<nav class="tabbar">
  <a href="/" class="on"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 9h18"/><path d="M8 5v4"/><path d="M11 12.2l3.4 1.9-3.4 1.9z" fill="currentColor" stroke="none"/></svg>GUIDE</a>
  <a href="/login"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-3.5 3.6-6.5 8-6.5s8 3 8 6.5"/></svg>ACCOUNT</a>
  <a href="/studio"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h8M16.5 8H20M4 16h4M12.5 16H20"/><circle cx="14" cy="8" r="2.5"/><circle cx="10" cy="16" r="2.5"/></svg>STUDIO</a>
</nav>

<script src="/socket.io/socket.io.js"></script>
<script src="/assets/common.js"></script>
<script src="/assets/home.js"></script>
</body>
</html>
